[package]
name = "virtfw-bios-64"
version = "0.0.1"
publish = false
description = "bios images for testing"
readme = "README.md"

license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "hello"

[[bin]]
name = "qemuinit"
required-features = [ "alloc" ]

[[bin]]
name = "igvmtest"

[[bin]]
name = "mefisto"
required-features = [ "efiloader" ]

[features]
alloc = [ "dep:linked_list_allocator", "virtfw-libhw/alloc" ]
efiloader = [ "alloc", "dep:efiloader" ]

[dependencies]
igvm_defs.workspace = true
log.workspace = true
zerocopy.workspace = true

efiloader = { version = "0.0.1", optional = true, git = "https://github.com/ardbiesheuvel/efiloader.git", rev = "f53e958" }
linked_list_allocator = { version = "0.10.5" , optional = true }
x86_64 = { version = "0.15.0", default-features = false, features = [ "instructions" ] }

virtfw-libhw.workspace = true

[build-dependencies]
cc = "1"
