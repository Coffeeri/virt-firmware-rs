[workspace]
resolver = "2"
members = [
	"bios-64",
	"efi-apps",
	"efi-tools",
	"igvm-tools",
	"libhw",
	"libefi",
	"varstore",
]

[workspace.package]
license = "MIT"
license-file = "LICENSE"
repository = "https://gitlab.com/kraxel/virt-firmware-rs"
authors = [ "Gerd Hoffmann <kraxel@redhat.com>" ]
edition = "2021"

[workspace.dependencies]
bitfield-struct = { version = "0.12" }
byteorder = { version = "1", default-features = false }
clap = { version = "4.5.4", features = ["derive"] }
der = { version = "0.7.10" }
fdt = { version = "0.1" }
igvm = { version = "0.4" }
igvm_defs = { version = "0.4" }
log = { version = "0.4", default-features = false }
serde = { version = "1", default-features = false, features = [ "alloc", "derive" ] }
serde_json = { version = "1", default-features = false, features = [ "alloc" ]  }
stderrlog = { version = "0.6" }
uefi = { version = "0.36" }
uefi-raw = { version = "0.12" }
uguid = { version = "2" }
x509-cert = { version = "0.2.5", default-features = false }
zerocopy = { version = "0.8", features = [ "derive" ] }

virtfw-libhw = { path = "libhw", version = "0.3.0" }
virtfw-libefi = { path = "libefi", version = "0.5.2" }
