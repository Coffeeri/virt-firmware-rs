[workspace]
resolver = "2"
members = [
	"bios-64",
	"efi-apps",
	"efi-tools",
	"igvm-tools",
	"libhw",
	"libefi",
	"varstore",
]

[workspace.package]
license = "MIT"
license-file = "LICENSE"
repository = "https://gitlab.com/kraxel/virt-firmware-rs"
authors = [ "Gerd Hoffmann <kraxel@redhat.com>" ]
edition = "2021"

[workspace.dependencies]
bitfield-struct = "0.11"
zerocopy = { version = "0.8", features = [ "derive" ] }
