[workspace]
resolver = "2"
members = [
	"efi-apps",
	"efi-tools",
	"experimental",
	"igvm-tools",
	"libhw",
	"libefi",
	"mefisto",
	"varstore",
]

[workspace.package]
license = "MIT"
license-file = "LICENSE"
repository = "https://gitlab.com/kraxel/virt-firmware-rs"
authors = [ "Gerd Hoffmann <kraxel@redhat.com>" ]
edition = "2021"

[workspace.dependencies]
bitfield-struct = { version = "0.13" }
byteorder = { version = "1", default-features = false }
clap = { version = "4.5.4", features = [ "derive", "wrap_help" ] }
clap_mangen = { version = ">= 0.2.30, < 0.4" }
env_logger = { version = "0.11" }
der = { version = "0.7.10" }
fdt = { version = "0.1" }
igvm = { version = "0.4" }
igvm_defs = { version = "0.4" }
log = { version = "0.4", default-features = false }
serde = { version = "1", default-features = false, features = [ "alloc", "derive" ] }
serde_json = { version = "1", default-features = false, features = [ "alloc" ]  }
spin = { version = ">= 0.10, < 0.13" }
uefi = { version = "0.39" }
uefi-raw = { version = "0.15.1" }
uguid = { version = "2" }
x509-cert = { version = "0.2.5", default-features = false }
zerocopy = { version = "0.8", features = [ "derive" ] }

virtfw-libhw = { path = "libhw", version = "0.5.0" }
virtfw-libefi = { path = "libefi", version = "0.6.0" }
