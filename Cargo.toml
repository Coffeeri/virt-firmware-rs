[workspace]
resolver = "2"
members = [
	"clapgen",
	"efi-apps",
	"efi-tools",
	"experimental",
	"igvm-tools",
	"libhw",
	"libefi",
	"mefisto",
	"varstore",
]

[workspace.package]
license = "MIT"
license-file = "LICENSE"
repository = "https://gitlab.com/kraxel/virt-firmware-rs"
authors = [ "Gerd Hoffmann <kraxel@redhat.com>" ]
edition = "2021"

[workspace.dependencies]
bitfield-struct = { version = "0.13", default-features = false }
byteorder = { version = "1", default-features = false }
clap = { version = "4.5.4", default-features = false, features = [ "std", "derive", "wrap_help" ] }
clap_complete = { version = "4", default-features = false }
clap_mangen = { version = ">= 0.2.30, < 0.4", default-features = false }
clap-markdown = { version = "0.1", default-features = false }
env_logger = { version = "0.11", default-features = false }
fdt = { version = "0.1", default-features = false }
hex = { version = "0.4", default-features = false, features = [ "alloc" ] }
igvm = { version = ">= 0.4, < 0.6", default-features = false }
igvm_defs = { version = ">= 0.4, < 0.6", default-features = false }
libc = { version = "0.2", default-features = false }
log = { version = "0.4", default-features = false }
num_enum = { version = "0.7.6", default-features = false }
serde = { version = "1", default-features = false, features = [ "alloc", "derive" ] }
serde_json = { version = "1", default-features = false, features = [ "alloc" ]  }
spin = { version = ">= 0.10, < 0.13", default-features = false, features = [ "spin_mutex" ] }
uefi = { version = ">= 0.39, < 0.42", default-features = false }
uefi-raw = { version = ">= 0.15, < 0.18", default-features = false }
uguid = { version = "2", default-features = false }
zerocopy = { version = "0.8", default-features = false, features = [ "derive" ] }

authenticode = { version = "0.6", default-features = false, features = [ "object" ] }
object = { version = "0.39", default-features = false }

cms = { version = "0.2", default-features = false }
der = { version = "0.7.10", default-features = false }
openssl = { version = "0.10", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
x509-cert = { version = "0.2.5", default-features = false }

virtfw-libhw = { path = "libhw", version = "0.5.2" }
virtfw-libefi = { path = "libefi", version = "0.7.1" }

[profile.release]
opt-level = "s"
codegen-units = 1
lto = true
