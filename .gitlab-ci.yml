#image: registry.fedoraproject.org/fedora:latest
image: registry.gitlab.com/kraxel/rpm-package-builder:rust

stages:
  - build
  - package
  - publish

#before_script:
#  - dnf install -y make gcc tree systemd-devel
#    seabios-bin edk2-ovmf edk2-experimental
#    cargo rustc rustfmt clippy
#    rust-std-static-x86_64-unknown-uefi
#    rust-std-static-x86_64-unknown-none

compile-x64:
  stage: build
  script:
    - make build
    - make doc
  artifacts:
    when: on_success
    paths:
      - bios-32/*.bin
      - target/x86_64-unknown-none/debug/*.bin
      - target/x86_64-unknown-none/debug/*.igvm
      - target/x86_64-unknown-uefi/debug/*.efi
      - target/doc
      - target/x86_64-unknown-none/doc
      - target/x86_64-unknown-uefi/doc

compile-aa64:
  stage: build
  tags:
    - aarch64.slow
  script:
    - make build
  artifacts:
    when: on_success
    paths:
      - target/aarch64-unknown-uefi/debug/*.efi

tests:
  stage: build
  script:
    - make test

release:
  stage: build
  script:
    - make install

pkg-libhw:
  stage: package
  needs: []
  script:
    - make package-libhw

pkg-libefi:
  stage: package
  needs: []
  script:
    - make package-libefi

pkg-efi-apps:
  stage: package
  needs: []
  script:
    - make package-efi-apps
  allow_failure: true

pkg-efi-tools:
  stage: package
  needs: []
  script:
    - make package-efi-tools
  allow_failure: true

pkg-igvm-tools:
  stage: package
  needs: []
  script:
    - make package-igvm-tools
  allow_failure: true

pkg-varstore:
  stage: package
  needs: []
  script:
    - make package-varstore
  allow_failure: true

pages:
  stage: publish
  needs:
    - compile-x64
    - compile-aa64
  script:
    - mkdir -p public/bios-32 public/bios-64 public/efi-apps/x64 public/efi-apps/aa64
    - for binary in helloefi.efi netboot.efi pciscan.efi hoblist.efi debuglog.efi; do
      mv -v target/x86_64-unknown-uefi/debug/$binary public/efi-apps/x64;
      mv -v target/aarch64-unknown-uefi/debug/$binary public/efi-apps/aa64;
      done
    - mv -v bios-32/*.bin public/bios-32
    - mv -v target/x86_64-unknown-none/debug/*.bin public/bios-64
    - mv -v target/x86_64-unknown-none/debug/*.igvm public/bios-64
    - tree -T "$CI_PROJECT_NAME" --charset utf8 -H -. public > index.html
    - mv index.html public
  only:
    - main
  artifacts:
    paths:
      - public/
