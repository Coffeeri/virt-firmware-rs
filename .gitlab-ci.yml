#image: registry.fedoraproject.org/fedora:latest
image: registry.gitlab.com/kraxel/rpm-package-builder:rust

workflow:
  rules:
    - if: $CI_PROJECT_NAMESPACE != "kraxel"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"

stages:
  - build
  - tests
  - package
  - publish

#before_script:
#  - dnf install -y make gcc tree systemd-devel
#    seabios-bin edk2-ovmf edk2-experimental
#    cargo rustc rustfmt clippy
#    rust-std-static-x86_64-unknown-uefi
#    rust-std-static-x86_64-unknown-none

compile-x64:
  stage: build
  tags:
    - x86_64.kraxel.org
  script:
    - make build
    - make doc
  artifacts:
    when: on_success
    paths:
      - bios-32/*.bin
      - bios-32/*.igvm
      - target/x86_64-unknown-none/debug/*.bin
      - target/x86_64-unknown-none/debug/*.igvm
      - target/x86_64-unknown-uefi/debug/*.efi
      - target/doc
      - target/x86_64-unknown-none/doc
      - target/x86_64-unknown-uefi/doc

compile-aa64:
  stage: build
  tags:
    - aarch64.kraxel.org
  script:
    - make build
  artifacts:
    when: on_success
    paths:
      - target/aarch64-unknown-uefi/debug/*.efi

release:
  stage: build
  tags:
    - any.kraxel.org
  script:
    - make install

cargo-audit:
  stage: build
  tags:
    - any.kraxel.org
  script:
    - make audit

cargo-machete:
  stage: build
  tags:
    - any.kraxel.org
  script:
    - cargo machete

test-cargo:
  stage: tests
  tags:
    - any.kraxel.org
  needs: []
  script:
    - make test

test-tmt:
  stage: tests
  needs: []
  before_script:
    - dnf install -y tmt
  script:
    - export TMT_WORKDIR_ROOT="$(pwd)/tmt-root"
    - PATH="$HOME/.cargo/bin:$PATH"
    - make install
    - make tmt-local
  after_script:
    - ARTIFACTS="https://${CI_PAGES_HOSTNAME}/-/${CI_PROJECT_NAME}/-/jobs/${CI_JOB_ID}/artifacts"
    - find tmt-root -name "*.html" -exec echo "${ARTIFACTS}/{}" ";"
  artifacts:
    when: always
    paths:
      - tmt-root

.pkg-check: &pkg-check
  stage: package
  tags:
    - any.kraxel.org
  needs: []
  script:
    - PKG=${CI_JOB_NAME#pkg-}
    - echo package is ${PKG}
    - make package-${PKG}

pkg-libhw:
  <<: *pkg-check

pkg-libefi:
  <<: *pkg-check

pkg-efi-apps:
  <<: *pkg-check
  allow_failure: true

pkg-efi-tools:
  <<: *pkg-check
  allow_failure: true

pkg-igvm-tools:
  <<: *pkg-check
  allow_failure: true

pkg-varstore:
  <<: *pkg-check
  allow_failure: true

fedora-rpm-check:
  stage: package
  needs: []
  script:
    - sed -e '/mefisto/d' -i Cargo.toml
    - sed -e '/experimental/d' -i Cargo.toml
    - mapfile -t rpms < <(cargo2rpm -p Cargo.toml buildrequires)
    - dnf install -y "${rpms[@]}"
  allow_failure: true

pages:
  stage: publish
  needs:
    - compile-x64
    - compile-aa64
  script:
    - mkdir -p public/bios-32 public/mefisto public/efi-apps/x64 public/efi-apps/aa64
    - for binary in helloefi.efi netboot.efi pciscan.efi hoblist.efi debuglog.efi; do
      mv -v target/x86_64-unknown-uefi/debug/$binary public/efi-apps/x64;
      mv -v target/aarch64-unknown-uefi/debug/$binary public/efi-apps/aa64;
      done
    - mv -v bios-32/*.bin public/bios-32
    - mv -v bios-32/*.igvm public/bios-32
    - mv -v target/x86_64-unknown-none/debug/*.bin public/mefisto
    - mv -v target/x86_64-unknown-none/debug/*.igvm public/mefisto
    - tree -T "$CI_PROJECT_NAME" --charset utf8 -H -. public > index.html
    - mv index.html public
  only:
    - main
  artifacts:
    paths:
      - public/

########################################################################
# trusted publishing on crates.io

oidc-test:
  stage: publish
  when: manual
  id_tokens:
    CRATES_IO_ID_TOKEN:
      aud: crates.io
  script:
    - export CRATES_IO_PUBLISH_TOKEN="$(scripts/oidc-token.sh)"
    - echo "${CRATES_IO_PUBLISH_TOKEN::16}..."
  allow_failure: true

upload-release:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^[a-z-]+-v[0-9.]+$/
  id_tokens:
    CRATES_IO_ID_TOKEN:
      aud: crates.io
  script:
    - PKG=${CI_COMMIT_TAG%-*}
    - VER=${CI_COMMIT_TAG##*-}
    - echo "package is $PKG - version is $VER"
    - export CARGO_REGISTRY_TOKEN="$(scripts/oidc-token.sh)"
    - case "$PKG" in
      efi-apps)  cargo publish --package "virtfw-$PKG" --target x86_64-unknown-uefi;;
      *)         cargo publish --package "virtfw-$PKG";;
      esac
