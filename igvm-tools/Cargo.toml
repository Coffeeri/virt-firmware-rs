[package]
name = "virtfw-igvm-tools"
version = "0.2.0"
publish = true
description = "igvm related linux applications"
readme = "README.md"

license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[features]
authenticode = [ "dep:authenticode" ]
default = [ "authenticode" ]

[dependencies]
bitfield-struct.workspace = true
clap.workspace = true
clap_mangen.workspace = true
igvm.workspace = true
igvm_defs.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
stderrlog.workspace = true
uguid.workspace = true
zerocopy.workspace = true

sha2 = "0.10.9"
object = "0.37"
authenticode = { version = "0.5", optional = true, features = [ "object" ] }

virtfw-libefi = { workspace = true, features = [ "std", "sbdata", "x509" ] }
