[package]
name = "virtfw-igvm-tools"
version = "0.1.6"
publish = true
description = "igvm related linux applications"
readme = "README.md"

license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
bitfield-struct.workspace = true
clap.workspace = true
log.workspace = true
stderrlog.workspace = true
uguid.workspace = true
zerocopy.workspace = true

igvm = "0.4"
igvm_defs = "0.4"

sha2 = "0.10.9"
object = "0.37"
authenticode = { version = "0.5", features = [ "object" ] }

virtfw-libefi = { path = "../libefi", version = "0.5.0", features = [ "std", "sbdata", "x509" ] }
