[package]
name = "virtfw-igvm-tools"
version = "0.2.6"
publish = true
description = "igvm related linux applications"
readme = "README.md"

license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[features]
authenticode = [ "dep:object", "dep:authenticode"  ]
default = [ "authenticode" ]

[dependencies]
bitfield-struct.workspace = true
clap.workspace = true
env_logger.workspace = true
igvm.workspace = true
igvm_defs.workspace = true
log.workspace = true
sha2.workspace = true
uguid.workspace = true
zerocopy.workspace = true

object = { workspace = true, optional = true, features = [ "elf" ] }
authenticode = { workspace = true, optional = true }

virtfw-libefi = { workspace = true, features = [ "std", "sbdata", "x509" ] }
