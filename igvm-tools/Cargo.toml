[package]
name = "virtfw-igvm-tools"
version = "0.2.3"
publish = true
description = "igvm related linux applications"
readme = "README.md"

license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[features]
authenticode = [ "dep:authenticode" ]
default = [ "authenticode" ]

[dependencies]
bitfield-struct.workspace = true
clap.workspace = true
clap_mangen.workspace = true
env_logger.workspace = true
igvm.workspace = true
igvm_defs.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uguid.workspace = true
zerocopy.workspace = true

object = "0.39"
authenticode = { version = "0.6", optional = true, features = [ "object" ] }

virtfw-libefi = { workspace = true, features = [ "std", "sbdata", "x509" ] }
