[package]
name = "virtfw-experimental"
version = "0.0.1"
publish = false
description = "playground for experimental code"
#readme = "README.md"

license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
clap.workspace = true
clap_mangen.workspace = true
cms.workspace = true
der.workspace = true
env_logger.workspace = true
log.workspace = true
openssl.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uguid.workspace = true
x509-cert.workspace = true
zerocopy.workspace = true

rust-lzma = "0.6"
object = "0.39"
authenticode = { version = "0.6", features = [ "object" ] }
hex = { version = "0.4", default-features = false, features = [ "alloc" ] }
x509-verify = { version = "0.4", features = [ "x509" ] }

virtfw-libefi = { workspace = true, features = [ "x509", "std", "eficmsopenssl" ] }
