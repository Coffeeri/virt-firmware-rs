[package]
name = "virtfw-efi-apps"
version = "0.1.5"
publish = true
description = "efi applications, mostly for testing"
readme = "README.md"

license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[features]
fdt = [ "dep:fdt" ]

[dependencies]
log.workspace = true
serde.workspace = true
serde_json.workspace = true
zerocopy.workspace = true

fdt = { version = "0.1", optional = true }
uefi = { version = "0.35", features = ["panic_handler", "logger", "log-debugcon", "alloc", "global_allocator" ] }
uefi-raw = "0.11"

virtfw-libhw = { workspace = true, features = ["alloc"] }
virtfw-libefi = { path = "../libefi", version = "0.5.0" }
