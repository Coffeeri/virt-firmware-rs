[package]
name = "virtfw-efi-apps"
version = "0.1.8"
publish = true
description = "efi applications, mostly for testing"
readme = "README.md"

license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[features]
fdt = [ "dep:fdt" ]

[dependencies]
log.workspace = true
serde.workspace = true
serde_json.workspace = true
uefi-raw.workspace = true
zerocopy.workspace = true

fdt = { workspace = true, optional = true }
uefi = { workspace = true, features = ["panic_handler", "logger", "log-debugcon", "alloc", "global_allocator" ] }

virtfw-libhw = { workspace = true, features = ["alloc"] }
virtfw-libefi = { workspace = true }
