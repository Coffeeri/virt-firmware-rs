[package]
name = "virtfw-efi-apps"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
uefi = { version = "0.34", features = ["panic_handler", "logger", "log-debugcon", "alloc", "global_allocator" ] }
uefi-raw = "0.10"
log = "0.4"
virtfw-libhw = { path = "../libhw", features = ["alloc"] }
serde = { version = "1", default-features = false, features = [ "alloc", "derive" ] }
serde_json = { version = "1", default-features = false, features = [ "alloc" ]  }
