[package]
name = "virtfw-varstore"
version = "0.1.0"
publish = true
description = "efi variable store"
readme = "README.md"

license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "pcap-replay"
required-features = [ "std" ]

[[bin]]
name = "json-read"
required-features = [ "std" ]

[features]
default = [ "std" ]
std = [ "zerocopy/std", "dep:flate2", "dep:getopts", "dep:stderrlog" ]

[dependencies]
getopts = { version = "0.2", optional = true }
log = { version = "0.4", default-features = false }
uefi = { version = "0.35", features = [ "alloc" ] }
uguid = { version = "2", features = [ "serde" ] }
stderrlog = { version = "0.6", optional = true }
virtfw-libefi = { path = "../libefi", version = "0.2.1" }
zerocopy = "0.8"
zerocopy-derive = "0.8"
serde = { version = "1", default-features = false, features = [ "alloc", "derive" ] }
serde_json = { version = "1", default-features = false, features = [ "alloc" ] }
hex = { version = "0.4", default-features = false, features = [ "alloc" ] }
flate2 = { version = "1", optional = true }
