[package]
name = "virtfw-varstore"
version = "0.6.4"
publish = true
description = "efi variable store"
readme = "README.md"

license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "pcap-replay"
required-features = [ "std", "json" ]

[[bin]]
name = "json-read"
required-features = [ "std", "json" ]

[[bin]]
name = "virt-fw-vars-setup"
required-features = [ "std", "json", "pem" ]

[features]
std = [ "zerocopy/std", "virtfw-libefi/std", "x509-cert/std", "dep:flate2", "dep:clap", "dep:clap_mangen", "dep:env_logger" ]
json = [ "dep:serde", "dep:serde_json", "uguid/serde" ]
sbtest = [ "virtfw-libefi/sbtest" ]
pem = [ "der/pem", "x509-cert/pem" ]

[dependencies]
der.workspace = true
log.workspace = true
uguid.workspace = true
x509-cert.workspace = true
zerocopy.workspace = true

clap = { workspace = true, optional = true }
clap_mangen = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
uefi = { workspace = true, features = [ "alloc" ] }

flate2 = { version = "1", optional = true }
hex = { version = "0.4", default-features = false, features = [ "alloc" ] }

virtfw-libefi = { workspace = true, features = [ "sbdata", "x509" ] }
