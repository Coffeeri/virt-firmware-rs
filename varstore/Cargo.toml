[package]
name = "virtfw-varstore"
version = "0.4.0"
publish = true
description = "efi variable store"
readme = "README.md"

license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "pcap-replay"
required-features = [ "std", "json" ]

[[bin]]
name = "json-read"
required-features = [ "std", "json" ]

[[bin]]
name = "setup-efi-vars"
required-features = [ "std", "json", "pem" ]

[features]
std = [ "zerocopy/std", "dep:flate2", "dep:clap", "dep:stderrlog" ]
json = [ "dep:serde", "dep:serde_json", "uguid/serde" ]
sbtest = [ "virtfw-libefi/sbtest" ]
pem = [ "der/pem", "x509-cert/pem" ]

[dependencies]
der.workspace = true
log.workspace = true
uguid.workspace = true
x509-cert.workspace = true
zerocopy.workspace = true

clap = { workspace = true, optional = true }
stderrlog = { workspace = true , optional = true }

flate2 = { version = "1", optional = true }
hex = { version = "0.4", default-features = false, features = [ "alloc" ] }
serde = { version = "1", optional = true, default-features = false, features = [ "alloc", "derive" ] }
serde_json = { version = "1", optional = true, default-features = false, features = [ "alloc" ] }
uefi = { version = "0.35", features = [ "alloc" ] }

virtfw-libefi = { path = "../libefi", version = "0.5.0", features = [ "sbdata", "x509" ] }
