[package]
name = "virtfw-varstore"
version = "0.3.0"
publish = true
description = "efi variable store"
readme = "README.md"

license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "pcap-replay"
required-features = [ "std", "json" ]

[[bin]]
name = "json-read"
required-features = [ "std", "json" ]

[features]
std = [ "zerocopy/std", "dep:flate2", "dep:getopts", "dep:stderrlog" ]
json = [ "dep:serde", "dep:serde_json", "uguid/serde" ]

[dependencies]
zerocopy.workspace = true

getopts = { version = "0.2", optional = true }
log = { version = "0.4", default-features = false }
uefi = { version = "0.35", features = [ "alloc" ] }
uguid = { version = "2" }
stderrlog = { version = "0.6", optional = true }
virtfw-libefi = { path = "../libefi", version = "0.2.6" }
serde = { version = "1", optional = true, default-features = false, features = [ "alloc", "derive" ] }
serde_json = { version = "1", optional = true, default-features = false, features = [ "alloc" ] }
hex = { version = "0.4", default-features = false, features = [ "alloc" ] }
flate2 = { version = "1", optional = true }
