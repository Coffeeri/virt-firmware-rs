[package]
name = "virtfw-varstore"
version = "0.0.1"
publish = false
description = "efi variable store"

license.workspace = true
authors.workspace = true
edition.workspace = true

[features]
default = [ "std" ]
std = [ "zerocopy/std" ]

[dependencies]
getopts = "0.2"
log = "0.4"
uefi = "0.34"
uguid = { version = "2", features = [ "serde" ] }
stderrlog = "0.6"
virtfw-libefi = { path = "../libefi", version = "0.2" }
zerocopy = "0.8"
zerocopy-derive = "0.8"
serde = { version = "1", default-features = false, features = [ "alloc", "derive" ] }
serde_json = { version = "1", default-features = false, features = [ "alloc" ]  }
