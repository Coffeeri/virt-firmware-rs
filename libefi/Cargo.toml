[package]
name = "virtfw-libefi"
version = "0.0.1"
publish = false
description = "library to read + write efi data structures"
readme = "README.md"

license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[features]
default = [ "std" ]
std = [ "zerocopy/std" ]

[dependencies]
bitfield-struct = "0.10"
byteorder = "1"
log = "0.4"
udev = "0.9"
uuid = "1"
zerocopy = "0.8"
zerocopy-derive = "0.8"
