[package]
name = "virtfw-libefi"
version = "0.7.0"
publish = true
description = "library to read + write efi data structures"
readme = "README.md"

license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[features]
std = [ "zerocopy/std", "byteorder/std", "log/std", "x509-cert/std", "x509-cert/pem", "der/std", "dep:chrono", "dep:clap", "dep:libc" ]
udev = [ "std", "dep:udev" ]
sbdata = []
sbtest = [ "sbdata" ]
x509 = [ "sbdata" , "dep:der", "dep:x509-cert" ]
eficms = [ "dep:cms" ]
eficmsopenssl = [ "eficms", "std", "dep:openssl" ]

[dependencies]
bitfield-struct.workspace = true
byteorder.workspace = true
log.workspace = true
uguid.workspace = true
zerocopy.workspace = true

clap = { workspace = true, optional = true }
cms = { workspace = true, optional = true }
der = { workspace = true, optional = true }
openssl = { workspace = true, optional = true }
x509-cert = { workspace = true, optional = true }

chrono = { version = "0.4", optional = true }
libc = { workspace = true, optional = true }
udev = { version = "0.9", optional = true }

[dev-dependencies]
env_logger.workspace = true
openssl = "0.10"
