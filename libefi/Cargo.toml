[package]
name = "virtfw-libefi"
version = "0.2.0"
publish = true
description = "library to read + write efi data structures"
readme = "README.md"

license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[features]
std = [ "zerocopy/std", "dep:udev" ]

[dependencies]
bitfield-struct = "0.11"
byteorder = "1"
log = "0.4"
udev = { version = "0.9", optional = true }
uguid = "2"
zerocopy = "0.8"
zerocopy-derive = "0.8"
