[package]
name = "virtfw-efi-tools"
version = "0.1.3"
publish = true
description = "efi related linux applications"
readme = "README.md"

license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "generate-boot-csv"

[[bin]]
name = "list-sb-vars"

[[bin]]
name = "mini-bootcfg"
required-features = [ "udev" ]

[[bin]]
name = "uefi-boot-menu"

[features]
udev = [ "virtfw-libefi/udev" ]

[dependencies]
uguid.workspace = true

byteorder = "1"
der = "0.7"
dialoguer = "0.11"
clap = { version = "4.5.4", features = ["derive"] }
glob = "0.3"
log = "0.4"
stderrlog = "0.6"
x509-cert = "0.2"

virtfw-libefi = { path = "../libefi", version = "0.4.0", features = [ "std" ] }
