[package]
name = "virtfw-efi-tools"
version = "0.1.6"
publish = true
description = "efi related linux applications"
readme = "README.md"

license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "generate-boot-csv"

[[bin]]
name = "list-sb-vars"

[[bin]]
name = "mini-bootcfg"
required-features = [ "udev" ]

[[bin]]
name = "uefi-boot-menu"

[features]
udev = [ "virtfw-libefi/udev" ]

[dependencies]
byteorder.workspace = true
clap.workspace = true
log.workspace = true
stderrlog.workspace = true
uguid.workspace = true

dialoguer = "0.12"
glob = "0.3"

virtfw-libefi = { workspace = true, features = [ "std", "sbdata", "x509" ] }
