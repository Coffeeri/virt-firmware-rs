[package]
name = "virtfw-efi-tools"
version = "0.1.3"
publish = true
description = "efi related linux applications"
readme = "README.md"

license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "generate-boot-csv"

[[bin]]
name = "list-sb-vars"

[[bin]]
name = "mini-bootcfg"
required-features = [ "udev" ]

[[bin]]
name = "uefi-boot-menu"

[features]
udev = [ "virtfw-libefi/udev" ]

[dependencies]
byteorder.workspace = true
clap.workspace = true
der.workspace = true
log.workspace = true
stderrlog.workspace = true
uguid.workspace = true
x509-cert.workspace = true

dialoguer = "0.11"
glob = "0.3"

virtfw-libefi = { path = "../libefi", version = "0.5.0", features = [ "std" ] }
