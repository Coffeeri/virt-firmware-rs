[package]
name = "virtfw-efi-tools"
version = "0.1.13"
publish = true
description = "efi related linux applications"
readme = "README.md"

license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "generate-boot-csv"

[[bin]]
name = "list-sb-vars"

[[bin]]
name = "enroll-sb-vars"
required-features = [ "eficms", "udev" ]

[[bin]]
name = "check-sb-signature"
required-features = [ "eficms" ]

[[bin]]
name = "mini-bootcfg"
required-features = [ "udev" ]

[[bin]]
name = "uefi-boot-menu"

[features]
udev = [ "virtfw-libefi/udev" ]
eficms = [ "virtfw-libefi/eficmsopenssl" ]

[dependencies]
authenticode.workspace = true
clap.workspace = true
der.workspace = true
env_logger.workspace = true
hex.workspace = true
log.workspace = true
object.workspace = true
sha2.workspace = true
uguid.workspace = true
x509-cert.workspace = true

dialoguer = "0.12"
glob = "0.3"

virtfw-libefi = { workspace = true, features = [ "std", "sbdata", "x509" ] }
